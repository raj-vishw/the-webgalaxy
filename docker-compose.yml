# Local PostgreSQL for development/production-like runs. Optional: without
# DATABASE_URL the API uses an embedded PostgreSQL (PGlite) in backend/data.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webgalaxy
      POSTGRES_PASSWORD: webgalaxy
      POSTGRES_DB: webgalaxy
    ports:
      - "5432:5432"
    volumes:
      - webgalaxy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webgalaxy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://webgalaxy:webgalaxy@db:5432/webgalaxy
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@webgalaxy.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      TRUST_PROXY: "true"
    ports:
      - "4000:4000"

volumes:
  webgalaxy-db:
